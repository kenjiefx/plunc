<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Integration Tests</title>
    <script type="text/javascript" src="/test/integration/plunc.js"></script>
  </head>
  <body>
    <main plunc-app="app"></main>
    <template plunc-name="app">
      This is an integration test for Plunc!
      <section plunc-component="FirstComponent"></section>
    </template>
    <template plunc-name="FirstComponent">
      This is the first component
      <section plunc-block="FirstComponentBlock">First component block</section>
      <section plunc-component="SecondComponent"></section>
    </template>
    <template plunc-name="SecondComponent">
      This is the second component. Hello, {{firstName}} {{lastName}}!
      <button plunc-click="emitAlert()">Click me</button>
    </template>
    <script type="text/javascript" src="/test/integration/index.js"></script>
  </body>
</html>
